<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core-AI oktapius</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .chat-container {
            width: 100%; max-width: 550px; height: 600px;
            background-color: #111827; border: 1px solid #1f2937;
            border-radius: 16px; display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); overflow: hidden;
        }
        .chat-header {
            background-color: #1f2937; padding: 20px;
            text-align: center; border-bottom: 1px solid #374151;
        }
        .chat-header h1 { font-size: 20px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
        .chat-header p { font-size: 13px; color: #9ca3af; margin-top: 4px; }
        
        .chat-box {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
            background-color: #070a13;
        }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; white-space: pre-line; }
        .msg.user { background-color: #38bdf8; color: #0f172a; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.ai { background-color: #1f2937; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .input-area {
            display: flex; padding: 15px; background-color: #111827;
            border-top: 1px solid #1f2937; gap: 10px;
        }
        input {
            flex: 1; background-color: #1f2937; border: 1px solid #374151;
            border-radius: 8px; padding: 14px; color: #fff; font-size: 15px; outline: none;
        }
        input:focus { border-color: #38bdf8; }
        .btn-send {
            background-color: #38bdf8; color: #0f172a; border: none;
            padding: 0 24px; border-radius: 8px; font-weight: 700;
            font-size: 15px; cursor: pointer; transition: background 0.2s;
        }
        .btn-send:hover { background-color: #0ea5e9; }
        .blink { animation: blinker 1s linear infinite; color: #fbbf24; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Core-AI Oktapius</h1>
            <p>Terhubung ke Inteligensia Cloud Global</p>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="msg ai">Halo! Saya sudah diperbarui dengan sistem AI Global tingkat lanjut. 🧠✨<br><br>Sekarang Anda bebas menanyakan apa saja, mulai dari resep makanan, tugas sekolah/kuliah, curhat, hingga trik coding. Ketik pertanyaan Anda di bawah ini!</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Tanyakan apa saja secara bebas di sini..." autocomplete="off" onkeydown="cekEnter(event)">
            <button class="btn-send" onclick="kirimPesan()">KIRIM</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        function cekEnter(e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                kirimPesan();
            }
        }

        async function kirimPesan() {
            const teksPesan = userInput.value.trim();
            if (teksPesan === "") return;

            // 1. Tampilkan pesan pengguna ke layar chat
            tampilkanChat(teksPesan, 'user');
            userInput.value = ""; 

            // 2. Tampilkan status loading AI sedang merumuskan jawaban
            const idLoading = 'load-' + Date.now();
            tampilkanChat("Sedang merumuskan jawaban...", 'ai', idLoading);
            document.getElementById(idLoading).classList.add('blink');

            try {
                // 3. Menghubungkan langsung ke server AI global (Menggunakan pollinations AI yang bebas CORS)
                // Ditambahkan instruksi sistem tersembunyi agar AI selalu merespons ramah dengan bahasa indonesia
                const promptSistem = "Jawablah menggunakan bahasa indonesia yang sangat ramah, solutif, dan mudah dipahami: " + teksPesan;
               const response = await fetch(
    "https://text.pollinations.ai/" +
    encodeURIComponent(promptSistem)
);
                const jawabanAI = await response.text();
                
                // Hapus indikator loading
                document.getElementById(idLoading).remove();

                // 4. Tampilkan jawaban cerdas dari server AI global ke layar chat
                if (jawabanAI.trim() !== "") {
                    tampilkanChat(jawabanAI, 'ai');
                } else {
                    tampilkanChat("Maaf, koneksi server data saya sedang penuh. Tolong kirim ulang pertanyaannya ya!", 'ai');
                }

            } catch (error) {
                // Tangani jika komputer tidak tersambung internet
                document.getElementById(idLoading).remove();
                tampilkanChat("Gagal terhubung ke satelit AI. Harap pastikan perangkat laptop Anda terhubung ke internet!", 'ai');
                console.error(error);
            }
        }

        function tampilkanChat(teks, sender, id = null) {
            const gelembungChat = document.createElement('div');
            gelembungChat.className = `msg ${sender}`;
            if (id) gelembungChat.id = id;
            gelembungChat.innerText = teks;
            
            chatBox.appendChild(gelembungChat);
            chatBox.scrollTop = chatBox.scrollHeight; // Otomatis gulung layar ke pesan paling bawah
        }
    </script>
</body>
</html>
