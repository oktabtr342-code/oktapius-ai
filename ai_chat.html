<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core-AI Chat Interface</title>
    <style>
        /* Gaya Tampilan (CSS) - Tema Gelap Modern */
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 450px;
            height: 600px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .chat-header {
            padding: 15px;
            background-color: #21262d;
            border-bottom: 1px solid #30363d;
            font-weight: bold;
            color: #58a6ff;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-message {
            background-color: #1f6feb;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #30363d;
            color: white;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            padding: 0 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 CORE-AI OKTAPIUS</div>
    
    <!-- Wadah pesan chat -->
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">
            Halo! Saya CORE-AI yang sudah terhubung secara online. Cobalah ketik sesuatu di bawah ini!
        </div>
    </div>
    
    <!-- Area Input dan Tombol -->
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan di sini..." autocomplete="off">
        <button id="btnKirim">KIRIM</button>
    </div>
</div>

<script>
    // Logika Pemrosesan (JavaScript)
    const userInput = document.getElementById('userInput');
    const btnKirim = document.getElementById('btnKirim');
    const chatMessages = document.getElementById('chatMessages');

    // Fungsi untuk mengirim pesan
    function kirimPesan() {
        const text = userInput.value.trim();
        
        // Validasi: Cegah kirim jika input kosong
        if (text === "") return;

        // 1. Tampilkan pesan user ke layar
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.innerText = text;
        chatMessages.appendChild(userDiv);

        // Kosongkan input setelah tombol ditekan
        userInput.value = "";
        
        // Auto-scroll ke pesan paling bawah
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // 2. Simulasi respon AI (Ganti bagian ini dengan integrasi API Anda)
        setTimeout(() => {
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.innerText = "Ini adalah respon otomatis. Untuk menghubungkan ke AI sungguhan, Anda perlu mengintegrasikan API Fetch ke server OpenAI/Gemini.";
            chatMessages.appendChild(aiDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 1000);
    }

    // Event Listener 1: Deteksi klik pada tombol KIRIM
    btnKirim.addEventListener('click', kirimPesan);

    // Event Listener 2: Memungkinkan kirim pesan dengan tombol Enter di keyboard
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            kirimPesan();
        }
    });
</script>

</body>
</html>
