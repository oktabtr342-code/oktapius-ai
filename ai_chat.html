<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oktapius AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            max-width: 900px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .status {
            margin-top: 6px;
            color: #4ade80;
            font-size: 13px;
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .welcome {
            text-align: center;
            color: #cbd5e1;
            margin-top: 50px;
        }

        .message {
            max-width: 75%;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            margin-left: auto;
            background: #2563eb;
        }

        .ai {
            margin-right: auto;
            background: #334155;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }

        #userInput {
            flex: 1;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-size: 16px;
        }

        #sendButton {
            padding: 0 22px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #1d4ed8;
        }

        #sendButton:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 90%;
            }

            #sendButton {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🤖 Oktapius AI</h1>
        <div class="status">● Online</div>
    </div>

    <div id="chatBox">

        <div class="welcome">
            <h2>Selamat Datang di Oktapius AI</h2>
            <p>Tanyakan apa saja kepada saya.</p>
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Tulis pertanyaan..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="kirimPesan()">
            Kirim
        </button>

    </div>

</div>


<script>

const input = document.getElementById("userInput");
const chatBox = document.getElementById("chatBox");
const tombol = document.getElementById("sendButton");


function tampilkanPesan(teks, kelas) {

    const pesan = document.createElement("div");

    pesan.className = "message " + kelas;

    pesan.textContent = teks;

    chatBox.appendChild(pesan);

    chatBox.scrollTop = chatBox.scrollHeight;

    return pesan;
}


async function kirimPesan() {

    const pertanyaan = input.value.trim();

    // Jangan kirim kalau kosong
    if (pertanyaan === "") {
        return;
    }

    // Tampilkan pertanyaan user
    tampilkanPesan(pertanyaan, "user");

    // Kosongkan input
    input.value = "";

    // Matikan tombol sementara
    tombol.disabled = true;
    tombol.textContent = "Menjawab...";

    // Tampilkan loading
    const loading = tampilkanPesan(
        "Oktapius sedang berpikir...",
        "ai"
    );


    try {

        const prompt =
            "Kamu adalah Oktapius AI, asisten AI yang ramah, " +
            "cerdas dan membantu. Jawablah dalam Bahasa Indonesia. " +
            "Pertanyaan pengguna: " +
            pertanyaan;


        const url =
            "https://text.pollinations.ai/" +
            encodeURIComponent(prompt);


        const response = await fetch(url);


        if (!response.ok) {
            throw new Error(
                "Server AI error: " + response.status
            );
        }


        const jawaban = await response.text();


        // Hapus loading
        loading.remove();


        // Tampilkan jawaban AI
        if (jawaban.trim() !== "") {

            tampilkanPesan(
                jawaban,
                "ai"
            );

        } else {

            tampilkanPesan(
                "Oktapius tidak menerima jawaban dari server.",
                "ai"
            );

        }

    } catch (error) {

        console.error(error);

        loading.remove();

        tampilkanPesan(
            "Gagal terhubung ke AI. Periksa koneksi internet lalu coba lagi.",
            "ai"
        );

    }


    // Aktifkan tombol kembali
    tombol.disabled = false;
    tombol.textContent = "Kirim";

    input.focus();
}


// Bisa kirim menggunakan tombol ENTER
input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        kirimPesan();

    }

});

</script>

</body>
</html>
