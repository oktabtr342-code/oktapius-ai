<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core-AI Chat Interface</title>
    <style>
        /* Gaya Tampilan (CSS) - Tema Gelap Modern */
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 450px;
            height: 600px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .chat-header {
            padding: 15px;
            background-color: #21262d;
            border-bottom: 1px solid #30363d;
            font-weight: bold;
            color: #58a6ff;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-message {
            background-color: #1f6feb;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #30363d;
            color: white;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            padding: 0 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 CORE-AI OKTAPIUS</div>
    
    <!-- Wadah pesan chat -->
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">
            Halo! Saya CORE-AI yang sudah terhubung secara online. Cobalah ketik sesuatu di bawah ini!
        </div>
    </div>
    
    <!-- Area Input dan Tombol -->
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan di sini..." autocomplete="off">
        <button id="btnKirim">KIRIM</button>
    </div>
</div>

<script>
    const userInput = document.getElementById('userInput');
    const btnKirim = document.getElementById('btnKirim');
    const chatMessages = document.getElementById('chatMessages');

    // 1. GANTI TULISAN DI BAWAH INI DENGAN API KEY YANG ANDA SALIN TADI
    const GEMINI_API_KEY = "PASTE_API_KEY_ANDA_DI_SINI"; 

    async function kirimPesan() {
        const text = userInput.value.trim();
        if (text === "") return;

        // Tampilkan pesan user ke layar
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.innerText = text;
        chatMessages.appendChild(userDiv);

        userInput.value = "";
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Tampilkan status loading "Sedang mengetik..."
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message ai-message';
        loadingDiv.innerText = "Sedang mengetik...";
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            // Ambil respons langsung dari server Google Gemini AI
            const response = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            // Hapus tulisan "Sedang mengetik..." setelah respons diterima
            if (chatMessages.contains(loadingDiv)) {
                chatMessages.removeChild(loadingDiv);
            }

            // Ambil teks jawaban dari struktur data JSON Gemini yang benar
            const aiJawaban = data.candidates[0].content.parts[0].text;
            
            // Tampilkan jawaban asli dari AI ke layar chat
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.innerText = aiJawaban;
            chatMessages.appendChild(aiDiv);
            
        } catch (error) {
            // Jika koneksi atau API Key bermasalah, hapus loading dan tampilkan pesan eror
            if (chatMessages.contains(loadingDiv)) {
                chatMessages.removeChild(loadingDiv);
            }
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message ai-message';
            errorDiv.innerText = "Gagal terhubung ke AI. Periksa koneksi internet atau pastikan API Key Anda benar.";
            chatMessages.appendChild(errorDiv);
            console.error(error);
        }

        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Pasang Event Listener agar tombol bisa diklik
    btnKirim.addEventListener('click', kirimPesan);

    // Pasang Event Listener agar bisa kirim lewat tombol Enter keyboard
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            kirimPesan();
        }
    });
</script>
</body>
</html>
