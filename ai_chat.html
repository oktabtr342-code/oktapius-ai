<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE-AI OKTAPIUS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #101f30 0%, #070c14 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: rgba(15, 28, 46, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            margin: 20px;
        }
        .chat-header {
            padding: 16px;
            background: rgba(7, 12, 20, 0.9);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00d4ff, #0056b3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .status-info h2 {
            font-size: 16px;
            color: #00d4ff;
            letter-spacing: 0.5px;
        }
        .status-online {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 2px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #39ff14;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #39ff14;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
        .header-btn {
            background: transparent;
            border: 1px solid rgba(255, 75, 75, 0.4);
            color: #ff4b4b;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .header-btn:hover {
            background: #ff4b4b;
            color: white;
            box-shadow: 0 0 10px rgba(255, 75, 75, 0.4);
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 14px;
            position: relative;
        }
        .bot-message {
            background: rgba(26, 42, 64, 0.8);
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .user-message {
            background: linear-gradient(135deg, #0076ffd9, #0056b3d9);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 12px rgba(0, 118, 255, 0.3);
        }
        .action-container {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
        }
        .copy-btn {
            background: transparent;
            border: none;
            color: #00d4ff;
            cursor: pointer;
            font-size: 11px;
            text-decoration: underline;
        }
        .input-area {
            padding: 16px;
            background: rgba(7, 12, 20, 0.9);
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            background: #101c2e;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .input-area button {
            background: linear-gradient(135deg, #00d4ff, #0076ff);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="profile-section">
            <div class="avatar">O</div>
            <div class="status-info">
                <h2>CORE-AI OKTAPIUS</h2>
                <div class="status-online"><span class="dot"></span>Terhubung ke Inteligensia Cloud Global</div>
            </div>
        </div>
        <button class="header-btn" onclick="clearChat()">Hapus Chat</button>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">
            <div>Halo! Saya sudah diperbarui dengan sistem AI Global tingkat lanjut. 🤖✨<br><br>Sekarang Anda bebas menanyakan apa saja. Ketik pertanyaan Anda di bawah ini!</div>
            <div class="action-container">
                <button class="copy-btn" onclick="copyText(this)">Salin</button>
            </div>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Tanyakan apa saja secara bebas di sini..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">KIRIM</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');

    function dapatkanJawabanAI(pertanyaan) {
        const kataKunci = pertanyaan.toLowerCase();
        if (kataKunci.includes('napas') || kataKunci.includes('bernapas')) {
            return "Manusia bernapas menggunakan paru-paru. Proses ini melibatkan penghirupan oksigen (O2) dan pengeluaran karbon dioksida (CO2).";
        } else if (kataKunci.includes('halo') || kataKunci.includes('hai')) {
            return "Halo! Ada yang bisa saya bantu hari ini?";
        } else if (kataKunci.includes('siapa kamu') || kataKunci.includes('nama')) {
            return "Saya adalah CORE-AI OKTAPIUS, asisten AI pintar global yang siap membantu Anda!";
        } else if (kataKunci.includes('pohon')) {
            return "Pohon adalah tumbuhan menahun dengan batang berkayu yang tumbuh memanjang, mendukung cabang dan daun pada sebagian besar spesies.";
        } else {
            return "Pertanyaan Anda tentang '" + pertanyaan + "' telah diterima oleh CORE-AI OKTAPIUS. Sistem cerdas kami mendeteksi topik ini sangat menarik untuk dipelajari!";
        }
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (text === '') return;

        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.innerText = text;
        chatBox.appendChild(userDiv);

        userInput.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        setTimeout(() => {
            const jawaban = dapatkanJawabanAI(text);
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            
            const msgContent = document.createElement('div');
            msgContent.innerText = jawaban;
            
            const actionDiv = document.createElement('div');
            actionDiv.className = 'action-container';
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerText = 'Salin';
            copyBtn.onclick = function() { copyText(copyBtn); };
            
            actionDiv.appendChild(copyBtn);
            botDiv.appendChild(msgContent);
            botDiv.appendChild(actionDiv);
            chatBox.appendChild(botDiv);
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 500);
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function clearChat() {
        chatBox.innerHTML = `
            <div class="message bot-message">
                <div>Riwayat obrolan dibersihkan. Ada yang bisa saya bantu lagi?</div>
                <div class="action-container">
                    <button class="copy-btn" onclick="copyText(this)">Salin</button>
                </div>
            </div>
        `;
    }

    function copyText(button) {
        const messageText = button.parentElement.parentElement.firstChild.innerText;
        navigator.clipboard.writeText(messageText).then(() => {
            button.innerText = 'Tersalin!';
            setTimeout(() => { button.innerText = 'Salin'; }, 2000);
        });
    }
</script>

</body>
</html>
